[project]
name = "kala-azar-7d"
version = "1.0.0"
description = "Replication package and formal Lean 4 verification proofs for: Double Latency and Global Stability in Kala-azar Dynamics (Applied Mathematics Letters)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pytest>=7.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
